<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mythree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Tammudu+2:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #26304a; --soft: #6b7287; --bg: #e4f2dc; --card: #ffffff;
      --leaf: #1f9d6b; --leaf-dark: #0f6b47; --leaf-soft: #e3f6ec;
      --gp: #f08a3c; --gp-soft: #fff0e3; --gp-dark: #9a4a0f;      /* grandpa: warm orange */
      --gs: #3b82d6; --gs-soft: #e7f0fc; --gs-dark: #1d4f8f;      /* grandson: blue */
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Baloo Tammudu 2", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
    button { font: inherit; cursor: pointer; }

    /* Top bar: name on the left, Refresh on the right */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 8px; border-bottom: 2px solid #cbe0c1; }
    h1 { font-size: 34px; line-height: 1; margin: 6px 0 0; letter-spacing: .5px; }
    #refresh { font-size: 16px; font-weight: 600; padding: 8px 18px; border-radius: 12px; border: 0; background: var(--leaf); color: #fff;
               box-shadow: 0 4px 0 var(--leaf-dark); transition: transform .1s, box-shadow .1s; }
    #refresh:hover { filter: brightness(1.05); }
    #refresh:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--leaf-dark); }
    .stage { position: relative; width: 200px; height: 186px; margin: 4px auto 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Mythree's koel (కోకిల) flies around the page, flapping its wings */
    #buddy { position: fixed; left: 0; top: 0; width: 190px; height: 181px; z-index: 10; pointer-events: none;
             transition: transform 1.1s cubic-bezier(.45,.05,.35,1); }
    #buddy .mascot { transition: transform .3s; }
    #buddy.left .mascot { transform: scaleX(-1); }
    #buddy.flying .wing-front, #buddy.happy .wing-front { animation: flap-front .18s ease-in-out infinite alternate !important; }
    #buddy.flying .wing-back, #buddy.happy .wing-back { animation: flap-back .18s ease-in-out infinite alternate !important; }
    #buddy.happy .wing-front, #buddy.happy .wing-back { animation-iteration-count: 10 !important; }
    #buddy.flying .feet, #buddy.flying .perch { opacity: 0; }
    .mascot .perch { transition: opacity .3s; }
    #buddy.landing .bird { animation: land .4s ease-out !important; }
    #buddy.lipsync .beak-low { animation: none !important; transform: rotate(var(--beak, 0deg)) !important; }
    @keyframes land { 0% { transform: translateY(-8px); } 55% { transform: translateY(3px) scaleY(.95); } 100% { transform: none; } }
    #buddy.flying .bird { animation: bob .36s ease-in-out infinite alternate; }
    #buddy:not(.flying) .bird { animation: hover-bob 2.6s ease-in-out infinite; }
    @keyframes flap-front { from { transform: rotate(8deg); } to { transform: rotate(-58deg); } }
    @keyframes flap-back { from { transform: rotate(-6deg); } to { transform: rotate(48deg); } }
    @keyframes bob { to { transform: translateY(-6px); } }
    @keyframes hover-bob { 50% { transform: translateY(-4px); } }

    /* The two people: tap a card to say who is talking */
    .people { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 4px; }
    .person { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 12px; border-radius: 22px; border: 3px solid transparent;
              background: var(--card); box-shadow: 0 3px 0 #cfe3c6; cursor: pointer; transition: transform .15s, border-color .2s, background .2s; }
    .person:hover { transform: translateY(-2px); }
    .person:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }
    .person .face { flex: none; width: 58px; height: 58px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; font-size: 32px; cursor: pointer; transition: transform .3s; }
    .person .tone { position: absolute; left: 52px; top: 52px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; padding: 0;
             background: #ffcc4d; box-shadow: 0 1px 3px rgba(0,0,0,.25); cursor: pointer; }
    .person .face:hover { transform: scale(1.15) rotate(8deg); }
    .person[aria-pressed="true"] .face { transform: scale(1.1) rotate(-6deg); }
    .person[data-person="a"] .face { background: var(--gp-soft); }
    .person[data-person="b"] .face { background: var(--gs-soft); }
    .person[data-person="a"][aria-pressed="true"] { border-color: var(--gp); background: var(--gp-soft); }
    .person[data-person="b"][aria-pressed="true"] { border-color: var(--gs); background: var(--gs-soft); }
    .fields { display: grid; gap: 6px; min-width: 0; flex: 1; }
    .fields select, .fields input { font: inherit; font-size: 15px; width: 100%; padding: 4px 8px; border-radius: 10px; border: 1.5px solid #e6dccd; background: #fff; color: var(--ink); }
    .fields .relation { font-size: 18px; font-weight: 600; }
    .now { position: absolute; top: -12px; right: 12px; font-size: 13px; padding: 0 10px; border-radius: 999px; color: #fff; opacity: 0; transition: opacity .2s; }
    .person[data-person="a"] .now { background: var(--gp); }
    .person[data-person="b"] .now { background: var(--gs); }
    .person[aria-pressed="true"] .now { opacity: 1; }
    .hint { text-align: center; color: var(--soft); font-size: 14px; margin: 6px 0 16px; }

    /* The big microphone button */
    .controls { text-align: center; }
    #start { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--leaf); color: #fff; font-size: 40px; box-shadow: 0 6px 0 var(--leaf-dark); transition: transform .1s, box-shadow .1s; }
    #start:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--leaf-dark); }
    #start.on { background: #e5484d; box-shadow: 0 6px 0 #a3262b; animation: pulse 1.6s infinite; }
    #start-label { display: block; margin-top: 8px; color: var(--soft); font-size: 16px; }
    @keyframes pulse { 0% { outline: 0 solid rgba(229,72,77,.35); } 100% { outline: 22px solid rgba(229,72,77,0); } }

    /* The conversation as chat bubbles */
    .talk { margin-top: 24px; padding: 16px; background: #fff; border-radius: 22px; box-shadow: 0 3px 0 #cfe3c6; }
    .talk h2 { margin: 0 0 12px; font-size: 20px; }
    #heard { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
    #heard:empty::before { content: "Tap the microphone and start talking"; display: block; text-align: center; color: var(--soft); padding: 24px; border: 2px dashed #c3dab8; border-radius: 20px; }
    #heard li { max-width: 85%; padding: 12px 16px; border-radius: 22px; font-size: 17px; line-height: 1.45; background: var(--card); animation: pop .25s ease-out; }
    #heard li[data-side="a"] { align-self: flex-start; border-bottom-left-radius: 6px; background: var(--gp-soft); }
    #heard li[data-side="b"] { align-self: flex-end; border-bottom-right-radius: 6px; background: var(--gs-soft); }
    #heard li > div:first-child { color: var(--soft); font-size: 16px; }
    .translation { margin-top: 6px; font-size: 22px; font-weight: 600; }
    li[data-side="a"] .translation { color: var(--gp-dark); }
    li[data-side="b"] .translation { color: var(--gs-dark); }
    .translation.thinking, #heard li.thinking { color: var(--soft); font-weight: 400; font-size: 17px; }
    .translation.error, #heard li.error { color: #8a1f1f; font-weight: 400; font-size: 16px; }
    .voice-tag { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--soft); }
    .voice-tag::before { content: "🔊 "; }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Settings and typing */
    .settings { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .settings button { font-size: 14px; padding: 5px 12px; border-radius: 999px; border: 2px solid #cbe0c1; background: #fff; color: var(--ink); }
    .settings button[aria-pressed="false"] { background: #eef1f5; color: var(--soft); }
    .settings button[id="type-btn"][aria-pressed="true"] { border-color: var(--leaf); color: var(--leaf-dark); }
    #typing { display: flex; gap: 8px; margin: 0 0 14px; }
    #typing[hidden] { display: none; }
    #typing input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 8px 12px; border-radius: 14px; border: 2px solid #cbe0c1; }
    #typing button { font-size: 16px; font-weight: 600; padding: 8px 18px; border-radius: 14px; border: 0; background: var(--leaf); color: #fff; }
    body.still #buddy, body.still #buddy * { animation: none !important; transition: none !important; }

    footer { margin-top: 32px; text-align: center; color: var(--soft); font-size: 14px; }

    /* The koel's moods (set on <body data-mood>) */
    .mascot { width: 100%; height: 100%; overflow: visible; }
    .mascot .head { transform-origin: 112px 76px; transition: transform .4s; }
    .mascot .wing-front { transform-origin: 104px 86px; transition: transform .4s; }
    .mascot .wing-back { transform-origin: 92px 86px; }
    .mascot .beak-low { transform-origin: 136px 65px; }
    .mascot .pupil { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; transition: transform .3s; }
    .mascot .lid, .mascot .zz, .mascot .dots, .mascot .waves, .mascot .note { opacity: 0; transition: opacity .3s; }
    .mascot .feet { transition: opacity .2s; }
    /* sleeping: head tucked, eyes closed, z z */
    body[data-mood="sleeping"] .mascot .head { transform: rotate(14deg) translate(-4px, 6px); }
    body[data-mood="sleeping"] .mascot .lid { opacity: 1; }
    body[data-mood="sleeping"] .mascot .pupil { opacity: 0; }
    body[data-mood="sleeping"] .mascot .zz { opacity: 1; animation: float 2.4s ease-in-out infinite alternate; }
    /* listening: head tilted, eyes wide, a little wing twitch */
    body[data-mood="listening"] .mascot .head { animation: tilt 2.2s ease-in-out infinite; }
    body[data-mood="listening"] .mascot .pupil { transform: scale(1.15); }
    /* hearing someone talk: leans in */
    body[data-mood="hearing"] .mascot .head { transform: rotate(-12deg); }
    body[data-mood="hearing"] .mascot .pupil { transform: scale(1.2); }
    body[data-mood="hearing"] .mascot .wing-front { transform: rotate(-10deg); }
    /* thinking: looks up, thought bubbles */
    body[data-mood="thinking"] .mascot .head { transform: rotate(-8deg); }
    body[data-mood="thinking"] .mascot .pupil { transform: translate(1px, -3px); }
    body[data-mood="thinking"] .mascot .dots { opacity: 1; }
    body[data-mood="thinking"] .mascot .wing-front { animation: ponder 1.8s ease-in-out infinite; }
    /* goodbye: waves a wing */
    body[data-mood="goodbye"] .mascot .wing-front { animation: wave .35s ease-in-out infinite alternate; }
    @keyframes ponder { 50% { transform: rotate(-9deg); } }
    /* speaking: beak moving, wing waving, sound waves */
    body[data-mood="speaking"] .mascot .beak-low { animation: talk .16s ease-in-out infinite alternate; }
    body[data-mood="speaking"] .mascot .wing-front { animation: wave .5s ease-in-out infinite alternate; }
    body[data-mood="speaking"] .mascot .waves { opacity: 1; animation: float .8s ease-in-out infinite alternate; }
    body[data-mood="error"] .mascot .head { transform: rotate(10deg); }
    body[data-mood="sleeping"] #buddy svg { pointer-events: auto; cursor: pointer; }   /* tap her only at home, so she never blocks a button */
    #buddy.happy .note { opacity: 1; animation: float .5s ease-in-out infinite alternate; }
    .hello { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, 6px) scale(.8); white-space: nowrap; background: #fff;
             border: 2px solid #e6dccd; border-radius: 16px; padding: 4px 12px; font-size: 16px; color: var(--ink); opacity: 0; pointer-events: none;
             transition: opacity .2s, transform .2s; }
    #buddy.happy .hello { opacity: 1; transform: translate(-50%, 0) scale(1); }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes tilt { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-12deg); } 60% { transform: rotate(6deg); } }
    @keyframes talk { to { transform: rotate(22deg); } }
    @keyframes wave { from { transform: rotate(0); } to { transform: rotate(-35deg); } }
    @keyframes float { from { transform: translateY(3px); } to { transform: translateY(-4px); } }

    @media (max-width: 560px) {
      .people { grid-template-columns: 1fr; gap: 18px; }
      h1 { font-size: 38px; }
      #heard li { max-width: 95%; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body data-mood="sleeping">
  <main>
    <header class="topbar">
      <h1>Mythree</h1>
      <button id="refresh" title="Clear the conversation and start again">🔄 Refresh</button>
    </header>
    <div class="stage" id="nest" aria-hidden="true"></div>
      <div id="buddy" aria-hidden="true">
        <svg class="mascot" viewBox="0 0 200 190">
          <defs>
            <linearGradient id="ko-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5c96"/><stop offset=".55" stop-color="#2b3765"/><stop offset="1" stop-color="#1b2344"/></linearGradient>
            <linearGradient id="ko-head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6db0"/><stop offset="1" stop-color="#2a3666"/></linearGradient>
            <linearGradient id="ko-wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4b85"/><stop offset="1" stop-color="#18203f"/></linearGradient>
            <linearGradient id="ko-tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3765"/><stop offset="1" stop-color="#151b36"/></linearGradient>
          </defs>
          <ellipse cx="102" cy="184" rx="34" ry="4" fill="#26304a" opacity=".07"/>
          <g class="perch">
            <path d="M54 166 Q112 158 178 171" stroke="#8a5a35" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M150 166 q12 -15 25 -10 q-8 12 -25 10z" fill="#5cb85c"/><path d="M70 164 q-10 -12 -22 -8 q8 11 22 8z" fill="#6cc76a"/>
          </g>
          <g class="bird">
            <g class="tail">
              <path d="M86 140 Q70 166 50 190 Q60 189 68 182 Q82 164 94 147 Z" fill="url(#ko-tail)"/>
              <path d="M92 146 Q82 170 72 192 Q81 187 86 178 Q96 160 99 150 Z" fill="url(#ko-tail)"/>
              <path d="M66 172 l5 -4 M75 162 l5 -4" stroke="#7d8fd0" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
            </g>
            <g class="wing-back"><ellipse cx="90" cy="110" rx="11" ry="34" fill="#1b2344" transform="rotate(22 90 110)"/></g>
            <ellipse cx="102" cy="110" rx="23" ry="46" fill="url(#ko-body)" transform="rotate(-18 102 110)"/>
            <ellipse cx="108" cy="118" rx="10" ry="30" fill="#5d70ad" opacity=".4" transform="rotate(-18 108 118)"/>
            <g class="feet" stroke="#8d93a3" stroke-width="4" fill="none" stroke-linecap="round">
              <path d="M104 152 q-2 7 -7 9 M104 152 q2 8 5 10"/><path d="M114 148 q-2 7 -7 9 M114 148 q2 8 5 10"/>
            </g>
            <g class="wing-front">
              <path d="M104 80 Q86 92 86 126 Q88 150 96 166 Q106 138 110 108 Q112 88 104 80 Z" fill="url(#ko-wing)"/>
              <path d="M92 112 q7 3 12 1 M91 126 q7 3 13 1 M93 140 q5 2 10 1" stroke="#7d8fd0" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".55"/>
            </g>
            <g class="head">
              <ellipse cx="116" cy="58" rx="22" ry="20" fill="url(#ko-head)"/>
              <path d="M110 39 q3 -8 9 -4 q3 -6 7 0" stroke="#4a5c96" stroke-width="4" fill="none" stroke-linecap="round"/>
              <path d="M104 47 q6 -4 13 -3" stroke="#9fb1f0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
              <g class="pupil"><circle cx="123.5" cy="54" r="6.8" fill="#e0182d" stroke="#7a0a16" stroke-width="1.2"/><circle cx="124.3" cy="54" r="2.6" fill="#1b1b2b"/><circle cx="126" cy="51.4" r="1.5" fill="#fff"/></g>
              <path class="lid" d="M116 55 Q123.5 60 131 55" stroke="#c9d1f5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path class="beak-low" d="M135 63 Q149 64 157 63 Q148 68 136 67 Z" fill="#e4e6ea" stroke="#6f7686" stroke-width="1"/>
              <path d="M134 53 Q149 56 162 61 Q150 64 136 64 Q131 59 134 53 Z" fill="#ffffff" stroke="#6f7686" stroke-width="1.2"/>
            </g>
          </g>
          <g class="zz" fill="#7f77dd" font-size="20" font-family="sans-serif"><text x="146" y="30">z</text><text x="162" y="16" font-size="14">z</text></g>
          <g class="dots" fill="#7f77dd"><circle cx="150" cy="30" r="4"/><circle cx="162" cy="18" r="5"/><circle cx="177" cy="5" r="6"/></g>
          <g class="waves" stroke="var(--gp)" stroke-width="3" fill="none" stroke-linecap="round"><path d="M168 56 Q176 64 168 72"/><path d="M178 50 Q190 64 178 78"/></g>
                  </svg>
        <span class="hello" id="hello">నమస్తే! I'm Mythree</span>
      </div>
    <span id="mood" class="mood sleeping sr-only" role="status">Sleeping</span>

    <div class="people" role="group" aria-label="The two people on the call: tap a card to say who is speaking">
      <div class="person" data-person="a" role="button" tabindex="0" aria-pressed="true">
        <button class="face" type="button" title="Tap to change the face" aria-label="Change face">🧔</button>
        <button class="tone" type="button" title="Skin tone" aria-label="Change skin tone"></button>
        <span class="fields">
          <select class="relation" aria-label="Relation"></select>
          <input class="name" placeholder="Name (optional)" maxlength="40" aria-label="Name">
          <select class="lang" aria-label="Language"><option value="te">తెలుగు · Telugu</option><option value="en">English</option></select>
        </span>
        <span class="now">🎙️ speaking</span>
      </div>
      <div class="person" data-person="b" role="button" tabindex="0" aria-pressed="false">
        <button class="face" type="button" title="Tap to change the face" aria-label="Change face">🧑</button>
        <button class="tone" type="button" title="Skin tone" aria-label="Change skin tone"></button>
        <span class="fields">
          <select class="relation" aria-label="Relation"></select>
          <input class="name" placeholder="Name (optional)" maxlength="40" aria-label="Name">
          <select class="lang" aria-label="Language"><option value="te">తెలుగు · Telugu</option><option value="en">English</option></select>
        </span>
        <span class="now">🎙️ speaking</span>
      </div>
    </div>
    <p class="hint">Mythree knows who is talking from their language</p>

    <div class="controls">
      <button id="start" aria-label="Start listening">🎙️</button>
      <span id="start-label">Start listening</span>
      <div class="settings" role="group" aria-label="Settings">
        <button id="voice-btn" type="button" aria-pressed="true">🔊 Voice on</button>
        <button id="motion-btn" type="button" aria-pressed="true">🕊️ Animation on</button>
        <button id="type-btn" type="button" aria-pressed="false">⌨️ Type instead</button>
      </div>
    </div>

    <section class="talk" aria-labelledby="talk-title">
      <h2 id="talk-title">Conversation</h2>
      <form id="typing" hidden>
        <input id="type-text" placeholder="Type what the chosen person wants to say" maxlength="1000" aria-label="Type a sentence" autocomplete="off">
        <button type="submit">Send</button>
      </form>
      <ol id="heard" aria-live="polite"></ol>
    </section>

    <footer>Nothing is saved · Made for the Meta Global AI Developer Hackathon</footer>
  </main>
  <script src="/static/ears.js"></script>
  <script src="/static/buddy.js"></script>
</body>
</html>
